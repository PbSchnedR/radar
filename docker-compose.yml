# RADAR avec Docker : « docker compose up -d », puis http://localhost:4319
#
# - web      : l'interface et ses routes /api (boutons Actualiser, Réglages…)
# - collecte : la collecte automatique (radar boucle), à la fréquence de « planification » dans radar.config.yaml
#
# Les infos (SQLite) vivent dans le volume « radar-data » : une base SQLite dans un dossier partagé
# avec Windows peut s'abîmer (verrous de fichiers peu fiables). Au premier démarrage, la base locale
# data/radar.db est copiée dans le volume si elle existe.
# Vos fichiers de configuration et de rapport restent ceux du dossier : modifiables des deux côtés.

x-radar: &radar
  build: .
  image: radar:latest
  env_file:
    - path: .env            # GH_TOKEN pour les sources GitHub (voir .env.exemple)
      required: false
  environment:
    TZ: Europe/Paris        # dates « aujourd'hui » et heures de collecte à l'heure française
    RADAR_COLLECTE_AUTO: docker
  volumes:
    - radar-data:/app/data
    - ./radar.config.yaml:/app/radar.config.yaml
    - ./rapport.textes.yaml:/app/rapport.textes.yaml
    - ./rapport.md:/app/rapport.md
    - ./data:/import:ro     # seulement lu, pour la copie initiale de la base
  restart: unless-stopped

services:
  web:
    <<: *radar
    # Copie initiale de la base locale dans le volume (une seule fois), puis l'interface.
    command: >
      sh -c "if [ ! -f data/radar.db ] && [ -f /import/radar.db ]; then cp /import/radar.db data/radar.db && echo 'Base locale importée dans le volume'; fi;
             exec npx vite preview --config ui/vite.config.js --host 0.0.0.0 --port 4319 --strictPort"
    ports:
      - "127.0.0.1:${RADAR_PORT:-4319}:4319" # seulement depuis cet ordinateur (RADAR_PORT pour changer de port) : l'interface peut lancer des commandes et modifier la config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4319/api/meta').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  collecte:
    <<: *radar
    command: ["node", "radar.js", "boucle"]
    depends_on:
      web:
        condition: service_healthy # attend la copie initiale de la base

volumes:
  radar-data:
