frequence: { failles: quotidien, tendances: hebdo }
livrable:  "top 10 du lundi + alerte si faille"

# Alertes : une NOUVELLE info déclenche une alerte si elle contient un de ces mots,
# ou si elle vient d'un des types de source listés. La 1re collecte d'une source n'alerte pas.
alertes:
  mots: ["cve", "vulnerab", "breaking change", "deprecated", "mcp"]
  sources: [failles, page]       # toute nouvelle faille et tout changement de page
  notification: true             # notification Windows en plus du terminal et de l'interface

# Collecte automatique : « radar planifier » crée une tâche Windows qui lance collect + score
# toutes les N heures (de 1 à 23). « radar deplanifier » la supprime.
planification: { toutes_les_heures: 6 }

# Le type de chaque info (un seul par info). Si la source a un « type_veille », il s'impose.
# Sinon, c'est le PREMIER type de cette liste dont un mot apparaît dans le titre ou l'extrait :
# mettez les types précis avant les types larges.
types_veille:
  - { nom: sécurité, mots: ["cve", "vulnerab", "faille", "security", "sécurité", "exploit"] }
  - { nom: légal,    mots: ["cgu", "terms of service", "conditions d'utilisation", "rgpd", "gdpr", "ai act"] }
  - { nom: devops,   mots: ["docker", "kubernetes", "terraform", "github actions", "deploy", "déploiement", "bazel", "pipeline"] }
  - { nom: ia,       mots: ["llm", "model", "modèle", "agent", "claude", "gpt", "codex", "mcp", "prompt", "gemini", "ollama", "openai", "anthropic", "hugging face", "deepmind", "artificial intelligence", "intelligence artificielle", "machine learning"] }

# Brique 4 : une info reçoit une étiquette si son titre ou son extrait contient un des « mots ».
# Une étiquette écrite seule (ex. - mcp) se déclenche sur son propre nom.
etiquettes:
  - { nom: mcp,        mots: ["mcp", "model context protocol"] }
  - { nom: sécurité,   mots: ["security", "sécurité", "vulnerab", "cve", "sandbox", "oidc", "oauth"] }
  - { nom: plugins,    mots: ["plugin", "skill", "hook"] }
  - { nom: cloud,      mots: ["bedrock", "vertex", "foundry", "aws", "gcp", "azure"] }
  - { nom: data,       mots: ["memory", "mémoire", "sqlite", "database", "storage", "transcript"] }
  - { nom: correctifs, mots: ["bug fix", "fixed"] }
seuil: 5          # fiabilité minimale pour qu'une info soit « retenue », sinon « ecartee »

# Brique 3 : chaque règle donne « points » si TOUTES ses conditions « si » sont vraies.
# Conditions possibles :
#   source: { champ: valeur }     un champ de la source dans « sources » (ex. categorie, vend_produit)
#   moins_de_jours: N             publiée il y a moins de N jours
#   champ_rempli: auteur          ce champ de l'info n'est pas vide
#   contient: [mots]              au moins un de ces mots (dans titre, url, extrait ; ou dans les champs listés par « dans »)
#   ne_contient_pas: [mots]       aucun de ces mots (mêmes champs)
#   dans: [champs]                limite contient / ne_contient_pas à ces champs
#   confirmee_ailleurs: true      une info d'une AUTRE source contient le même mot-clé (liste mots_cles)
regles_score:
  - { nom: "source officielle",       points: 3,  si: { source: { categorie: officielle } } }
  - { nom: "source institution",      points: 2,  si: { source: { categorie: institution } } }
  - { nom: "source presse",           points: 2,  si: { source: { categorie: presse } } }
  - { nom: "source communauté",       points: 1,  si: { source: { categorie: communaute } } }
  - { nom: "source réseau social",    points: 0,  si: { source: { categorie: social } } }
  - { nom: "publiée il y a < 6 mois", points: 1,  si: { moins_de_jours: 183 } }
  - { nom: "auteur identifié",        points: 1,  si: { champ_rempli: auteur, ne_contient_pas: ["[bot]"], dans: [auteur] } }
  - { nom: "source ou méthode citée", points: 1,  si: { contient: ["http://", "https://", "(#", "source :", "source:", "methodology", "méthode"], dans: [extrait] } }
  - { nom: "confirmée par une autre source", points: 1, si: { confirmee_ailleurs: true } }
  - { nom: "lien affilié ou partenaire", points: -2, si: { contient: ["affiliate", "affilié", "partenaire", "partner", "sponsored", "sponsorisé", "?ref=", "utm_"] } }
  - { nom: "l'auteur vend le produit",   points: -2, si: { source: { vend_produit: true } } }
