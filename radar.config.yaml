axes:      [cli-ia, securite, cgu-ia]          # 3 à 5 thèmes, au moins 3 types de veille
mots_cles: ["claude code", "codex", "MCP"]     # ce qui déclenche une capture
ignorer:   ["crypto", "NFT"]                   # ce qu'on décide de ne PAS surveiller
# Types de source (champs obligatoires entre parenthèses ; « nom », « limite », « categorie », « type_veille » sont facultatifs) :
#   releases   (depot)               versions d'un dépôt GitHub, via gh api
#   flux       (url)                 flux RSS ou Atom : blog, actualités, https://github.com/<depot>/releases.atom
#   hackernews (requete)             articles Hacker News contenant la requête ; « points_min » facultatif ; « une: true » = page d'accueil (requete facultative)
#   failles    (paquet, ecosysteme)  failles connues (base OSV) ; ecosysteme : npm, PyPI, Go, Maven, crates.io… ; « version » facultative
#   page       (url)                 page sans flux : une info est créée quand son texte change
#   depot      (depot)               chiffres d'un dépôt GitHub (étoiles, forks, licence), une mesure par jour
#   npm        (paquet)              téléchargements npm sur 7 jours, une mesure par semaine
# « famille » sert à filtrer dans l'interface (blog, agregat, presse, securite…) ; sans elle, la famille est le type de source.
# « categorie » donne les points de fiabilité : officielle, institution, presse, communaute, social.
sources:
  # --- GitHub : versions
  - { type: releases, famille: github, depot: anthropics/claude-code, nom: "Dépôt GitHub officiel anthropics/claude-code", limite: 10, categorie: officielle }
  - { type: releases, famille: github, depot: openai/codex, categorie: officielle }
  - { type: releases, famille: github, depot: google-gemini/gemini-cli, nom: "GitHub google-gemini/gemini-cli", categorie: officielle }
  - { type: releases, famille: github, depot: modelcontextprotocol/typescript-sdk, nom: "GitHub MCP TypeScript SDK", categorie: officielle }
  - { type: releases, famille: github, depot: ollama/ollama, nom: "GitHub ollama/ollama", categorie: officielle }
  - { type: releases, famille: github, depot: microsoft/vscode, nom: "GitHub microsoft/vscode", limite: 5, categorie: officielle }
  - { type: releases, famille: github, depot: vitejs/vite, nom: "GitHub vitejs/vite", limite: 5, categorie: officielle }
  - { type: releases, famille: github, depot: nodejs/node, nom: "GitHub nodejs/node", limite: 5, categorie: officielle }
  - { type: releases, famille: github, depot: kubernetes/kubernetes, nom: "GitHub kubernetes/kubernetes", limite: 5, categorie: officielle }
  - { type: releases, famille: github, depot: docker/compose, nom: "GitHub docker/compose", limite: 5, categorie: officielle }
  # --- GitHub : chiffres (étoiles, licence)
  - { type: depot, famille: chiffres, depot: anthropics/claude-code, nom: "Stats GitHub claude-code", categorie: officielle }
  - { type: depot, famille: chiffres, depot: openai/codex, nom: "Stats GitHub codex", categorie: officielle }
  - { type: depot, famille: chiffres, depot: google-gemini/gemini-cli, nom: "Stats GitHub gemini-cli", categorie: officielle }
  - { type: depot, famille: chiffres, depot: ollama/ollama, nom: "Stats GitHub ollama", categorie: officielle }
  - { type: depot, famille: chiffres, depot: modelcontextprotocol/servers, nom: "Stats GitHub MCP servers", categorie: officielle }
  # --- npm : téléchargements
  - { type: npm, famille: chiffres, paquet: "@anthropic-ai/claude-code", nom: "npm @anthropic-ai/claude-code", categorie: officielle }
  - { type: npm, famille: chiffres, paquet: "@openai/codex", nom: "npm @openai/codex", categorie: officielle }
  - { type: npm, famille: chiffres, paquet: "@google/gemini-cli", nom: "npm @google/gemini-cli", categorie: officielle }
